[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vera-simulator"
version = "0.1.0"
description = "Multi-tenant medtech demo bench for Vera"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "openai>=1.50",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "faker>=24.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["simulator*"]
