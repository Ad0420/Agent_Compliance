name: ScribeMD frontend tests

on:
  pull_request:

jobs:
  vitest:
    name: vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator/customers/scribemd/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simulator/customers/scribemd/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npm test
