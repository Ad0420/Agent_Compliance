name: Simulator CI

on:
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (Vera + ScribeMD)
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: development
      SECRET_KEY: dev_secret_change_in_production
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            simulator/customers/scribemd/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r simulator/customers/scribemd/backend/requirements.txt
          pip install pytest-timeout
          pip install -e ./sdk
          if [ -f simulator/pyproject.toml ]; then
            pip install -e ./simulator
          fi

      - name: Run Vera backend tests
        run: python -m pytest backend/tests/ -v --tb=short

      - name: Run ScribeMD backend tests
        run: python -m pytest simulator/customers/scribemd/backend/tests/ -v --tb=short --timeout=60

  frontend-checks:
    name: Frontend checks (ScribeMD)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: simulator/customers/scribemd/frontend/package-lock.json

      - name: Install dependencies
        working-directory: simulator/customers/scribemd/frontend
        run: npm ci

      - name: Lint
        working-directory: simulator/customers/scribemd/frontend
        run: npm run lint

      - name: Type-check
        working-directory: simulator/customers/scribemd/frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: simulator/customers/scribemd/frontend
        run: npm run build
