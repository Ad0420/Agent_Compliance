name: TriageGuard e2e (Playwright)

on:
  pull_request:

jobs:
  triageguard-e2e:
    name: Playwright happy-path
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: development
      SECRET_KEY: dev_secret_change_in_production
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            simulator/customers/triageguard/backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r simulator/customers/triageguard/backend/requirements.txt
          pip install pytest-timeout
          pip install -e ./sdk
          if [ -f simulator/pyproject.toml ]; then
            pip install -e ./simulator
          fi

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: simulator/customers/triageguard/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: simulator/customers/triageguard/frontend
        run: npm ci

      - name: Install e2e dependencies
        working-directory: simulator/customers/triageguard/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: simulator/customers/triageguard/e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        working-directory: simulator/customers/triageguard/e2e
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: simulator/customers/triageguard/e2e/playwright-report/
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: simulator/customers/triageguard/e2e/test-results/
          retention-days: 7
