name: TriageGuard Backend CI

on:
  pull_request:

jobs:
  triageguard-backend:
    name: TriageGuard backend tests
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: development
      SECRET_KEY: dev_secret_change_in_production
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            simulator/customers/triageguard/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r simulator/customers/triageguard/backend/requirements.txt
          pip install pytest-timeout
          pip install -e ./sdk
          if [ -f simulator/pyproject.toml ]; then
            pip install -e ./simulator
          fi

      - name: Run TriageGuard backend tests
        run: python -m pytest simulator/customers/triageguard/backend/tests/ -v --tb=short --timeout=60
