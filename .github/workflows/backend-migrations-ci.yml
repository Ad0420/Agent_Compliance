name: Backend Migrations CI

# Mirrors backend/start.sh: Railway bootstraps schema via SQLAlchemy's
# create_all and then runs `alembic stamp b2c3d4e5f6a7 && alembic upgrade head`
# to apply post-baseline migrations. This job exercises that exact path
# against Postgres so we catch dialect-incompatible migrations (e.g. integer
# defaults on BOOLEAN columns) before they take down a deploy.

on:
  pull_request:

jobs:
  migrations:
    name: alembic upgrade head (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ENVIRONMENT: development
      SECRET_KEY: dev_secret_change_in_production
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Bootstrap schema via create_all (mirrors first-deploy path)
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine
          from app.models.base import Base
          import app.models  # noqa: F401 — side-effect: registers tables
          engine = create_engine(os.environ["DATABASE_URL"])
          Base.metadata.create_all(engine)
          PY

      - name: Stamp baseline + alembic upgrade head
        working-directory: backend
        run: |
          alembic stamp b2c3d4e5f6a7
          alembic upgrade head
