name: Backend Migrations CI

# Mirrors production startup: schema changes are owned by Alembic, not
# SQLAlchemy create_all. This job exercises `alembic upgrade head` against
# Postgres so dialect-incompatible migrations fail before deploy.

on:
  pull_request:

jobs:
  migrations:
    name: alembic upgrade head (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ENVIRONMENT: development
      SECRET_KEY: dev_secret_change_in_production
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Alembic upgrade head
        working-directory: backend
        run: alembic upgrade head
